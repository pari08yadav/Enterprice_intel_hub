services:
  # 1. Vector Database (Qdrant)
  vector-db:
    image: qdrant/qdrant
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z

  # 2. Graph Database (Neo4j)
  graph-db:
    image: neo4j:latest
    container_name: neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]  # <--- Installs the plugin
      - NEO4J_dbms_security_procedures_unrestricted=apoc.* # <--- Grants permission
    volumes:
      - ./neo4j_data:/data
    restart: always
